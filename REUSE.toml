version = 1
SPDX-PackageName = "kannada-ocr"
SPDX-PackageDownloadLocation = "https://github.com/openkannada/kannada-ocr"

[[annotations]]
path = ["Cargo.toml", "Cargo.lock", "crates/*/Cargo.toml", "pyproject.toml", "uv.lock", ".gitignore", ".github/**", "fonts.json", "tests/fixtures/**"]
SPDX-FileCopyrightText = "2026 The Open Kannada Authors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["**/*.md", "results/**", "sources/**", "pilots/**/*.tsv", "pilots/**/*.txt", "pilots/**/*.json", "pilots/**/*.jsonl"]
SPDX-FileCopyrightText = "2026 The Open Kannada Authors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["LICENSE-MODEL", "NOTICE"]
SPDX-FileCopyrightText = ["Tesseract OCR project contributors", "2026 The Open Kannada Authors"]
SPDX-License-Identifier = "Apache-2.0"
