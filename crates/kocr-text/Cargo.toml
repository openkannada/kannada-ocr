[package]
name = "kocr-text"
description = "Kannada OCR text tools: scoring normalization, akshara-aware error rates, and Nudi conversion, built on kannadi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
kannadi = { git = "https://github.com/openkannada/kannadi", rev = "c786820bc3bf44e4dacef7338188a4381f4cdd0b" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
