[package]
name = "kocr-text"
description = "Kannada OCR text tools: scoring normalization, akshara-aware error rates, and Nudi conversion, built on kannadi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
kannadi = { git = "https://github.com/openkannada/kannadi", rev = "93fa0917d22a39df892bbe206a7bb3ce49f75ff9" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
