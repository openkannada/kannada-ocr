[project]
name = "kannada-ocr"
version = "0.1.0"
description = "Benchmark, synthetic data pipeline and baselines for open Kannada OCR"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Prasad Subrahmanya", email = "prasadus92@gmail.com" }]
dependencies = [
    "freetype-py>=2.5.1",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pyarrow>=26.0.1",
    "rapidfuzz>=3.14.6",
    "uharfbuzz>=0.57.0",
]

[project.optional-dependencies]
vlm = ["mlx-vlm>=0.7.12"]

[project.scripts]
kocr = "kannada_ocr.cli:main"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kannada_ocr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
